[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slam-robot"
version = "0.1.0"
authors = [
    {name = "Clément Besnier", email = "clem@clementbesnier.fr"}
]
description = "SLAM for a robot"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["robot", "SLAM", "mapping", "localization"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "jupyter-book",
]

[project.urls]
Homepage = "https://github.com/clemsciences/slam_robot"

[project.scripts]
rebuild-book = "slam_robot.utils.build_book:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*"]